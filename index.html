let itActAll=0;
function itemView(id,rep,fresh){const i0=db.items.find(x=>x.id==id);if(!i0)return;itActAll=0;
 pg(()=>(db.items.find(x=>x.id==id)||i0).name,()=>{const i=db.items.find(x=>x.id==id)||i0,act=[],LR=db.adj.some(a=>a.item==id&&(a.why=='loss'||a.why=='found'))?lossRows():[];
  db.bills.forEach(b=>{if(!b.void)b.lines.forEach(l=>{if(l.id==id)act.push({f:"billView('"+b.id+"')",t:b.t,ic:'bag',io:'in',s:'Sold '+qtxt(l,i0),w:b.cust||'Walk-in',a:lnet(l)})})});db.purch.forEach(p=>{if(!p.void)p.lines.forEach(l=>{if(l.id==id)act.push({f:"pView('"+p.id+"')",t:p.t,ic:'box',io:'out',s:'Bought '+qtxt(l,i0),w:p.sn,a:l.q*l.r*(1+(l.g||0)/100)})})});db.adj.forEach(a=>{if(a.item==id&&a.q){const la=adjAct(a,i0,LR);if(la){act.push(la);return}const c=a.c!=null?Math.abs(a.q)*a.c*(1+(i0.gst||0)/100):null;act.push({t:a.t,ic:'box',io:'',s:(a.why=='opening'?'Opening stock ':'Stock adjusted ')+(a.q>0?'+':'−')+qtxt({q:Math.abs(a.q)},i0),a:c,...(a.why!='opening'&&a.id?{f:"adjUndo('"+a.id+"')",h:'tap to undo'}:{})})}});db.notes.forEach(n=>{if(!n.void)n.lines.forEach(l=>{if(l.id==id)act.push({f:"noteView('"+n.id+"')",t:n.t,ic:'undo',io:n.kind=='d'?'in':'out',s:(n.kind=='d'?'Purchase return ':'Return ')+qtxt(l,i0),w:n.pn||(n.kind=='d'?'':'Walk-in'),a:l.q*l.p*(n.kind=='d'?1+(l.g||0)/100:1)})})});act.sort((a,b)=>b.t-a.t);
  const sv=itemValue(i,costing()),hasWh=+i.wp>0||+i.wpp>0;
  return `${fresh?'<div class="c ok">✔ Item saved</div>':''}${i.hide?'<div class="c">Hidden from lists and search. Past records still use it.</div>':''}<div class="c"><div class="iv-pr-sec"><div class="iv-price"><div><span class="iv-lbl">Selling price</span><div class="iv-sp"><span class="iv-p"><b>₹${money(i.price)}</b><small>/${esc(uA(uC(i)))}</small></span>${+i.pq>1?`<span class="iv-sep">·</span><span class="iv-pk"><b>₹${money(i.pp||i.price*i.pq)}</b><small>/${esc(i.pu||'Box')}</small><span class="iv-tag">${i.pq} ${esc(uQ(uC(i),i.pq))}</span></span>`:''}</div></div><div class="iv-mrp-wrap"><span class="iv-lbl">MRP</span><span class="iv-mrp">${+i.mrp>0?'₹'+money(i.mrp):'—'}</span></div></div>${hasWh?`<div class="iv-wh"><span class="iv-whv">${+i.wp>0?`<span class="iv-wp">₹${money(i.wp)}<small>/${esc(uA(uC(i)))}</small></span>`:''}${+i.pq>1&&(+i.wpp>0||+i.wp>0)?`${+i.wp>0?'<span class="iv-sep">·</span>':''}<span class="iv-wp">₹${money(+i.wpp>0?i.wpp:i.wp*i.pq)}<small>/${esc(i.pu||'Box')}</small></span>`:''}</span><span class="iv-tag">Wholesale</span></div>`:''}</div><div class="iv-stk"><span class="iv-sl">In stock</span><span class="iv-sv ${i.stock<=(i.min??5)?'due':''}">${stockTxt(i)}</span>${sv>0.004?`<span class="iv-sl">Stock value</span><span class="iv-sv">₹${money(sv)}</span>`:''}</div><div class="iv-pills"><span class="pill">GST ${+i.gst>0?i.gst+'%':'None'}</span><span class="pill">HSN ${esc(i.hsn||'—')}</span><span class="pill">Barcode ${esc(i.code||'—')}</span></div><div class="iv-war">Warranty: ${i.wv>0?esc(wFmt(i.wv,i.wu)):'None'}</div>${(()=>{if(!i.cost)return '';const bx=i.bi=='box'&&+i.pq>1,mu=bx?i.pq:1,lb='Last cost'+(bx?' / '+esc(i.pu||'box'):' / '+uA(uC(i)));return ownerBox(ownerRows([[lb,'₹'+money(gcost(i)*mu)+(comp()?'':` <span style="font-weight:400">(₹${money(i.cost*mu)} w/o GST)</span>`)]]))})()}</div>${act.length>20?`<div class="line sp"><div class="sec">${itActAll?'All activity':'Recent activity'}</div><button class="lnk" onclick="itActAll=${itActAll?0:1};pgRefresh()">${itActAll?'Show less':'See all'}</button></div>`:'<div class="sec">Recent activity</div>'}${listBox(act.slice(0,itActAll?act.length:20).map(a=>listRow({go:a.f||'',ic:ic(a.ic||'doc'),io:a.io||'',tcls:'dtl',title:`<span class="ell">${esc(a.s)}${a.w?`<span class="dtn"> · ${esc(a.w)}</span>`:''}</span><span class="dtx"> · ${dt(a.t)}</span>`,val:a.a==null?'':`₹${money(a.a)}`})).join(''))||'<div class="empty"><span class="m">No transactions yet.</span></div>'}`},
  ()=>{const it=db.items.find(x=>x.id==id)||{};return ribbon([['edit','Edit',`itemForm(${id})`,'','e'],['box','Stock','','','',[['box','Add stock (purchase)',`buyItem(${id})`,'','Add stock'],...(+it.stock>0?[['del','Lost / stolen / damaged',`lossForm(${id})`,'','Lost/damaged']]:[])]],it.hide?['undo','Unhide',`hideItem(${id},0)`,'','d']:['del','Delete',`delItem(${id})`,'rd','d']])},rep)}


function buyItem(id,fs){salePend=fs?id:null;flowFrom();closeAll();if(pEditId)resetPurch();if(!pdate)pdate=today();tab='purch';padd(id)}
const itemUses=id=>[db.bills,db.purch,db.notes,db.est].reduce((t,a)=>t+a.filter(r=>!r.void&&r.lines.some(l=>l.id==id)).length,0);
function hideItem(id,on){const i=db.items.find(x=>x.id==id);if(!i)return;if(on)i.hide=true;else delete i.hide;i.u=Date.now();cart=cart.filter(x=>x.id!=id);save();render();toast(on?'Item hidden.':'Item unhidden.');pgBack();pgRefresh()}
/* undo a stock adjustment made by mistake in Edit item: the entry is removed, stock and cost are recomputed from the rest of the history */
function adjUndo(aid){const a=db.adj.find(x=>x.id==aid);if(!a)return;const i=db.items.find(x=>x.id==a.item);if(!i)return;ask('Undo this stock adjustment ('+(a.q>0?'+':'−')+qtxt({q:Math.abs(a.q)},i)+', '+dt(a.t)+')? Stock will change from '+stockTxt(i)+' to '+stockTxt({...i,stock:Math.round(((+i.stock||0)-a.q)*1000)/1000})+'.','Undo adjustment',"adjDel('"+aid+"')")}
function adjDel(aid){const a=db.adj.find(x=>x.id==aid);if(!a)return;db.adj=db.adj.filter(x=>x.id!=aid);db.tomb[aid]=Date.now();const i=db.items.find(x=>x.id==a.item);if(i)i.u=Date.now();syncCosts([a.item]);recalc();save();render();pgRefresh();toast('Adjustment undone.')}
/* ---- record a loss (theft, lost, damaged, expired): the same function for every reason; the reason is only a field ---- */
function lossUpd(id){const q=+$('#l1').value||0,e=$('#l9');if(e)e.textContent=q>0?'Loss value about ₹'+money(q*lossUnit(id))+' at purchase cost (not selling price)':''}
function lossForm(id){const i=db.items.find(x=>x.id==id);if(!i)return;
 pg('Lost / stolen / damaged',()=>`<div class="dtr">${dchip('l3',today(),'')}</div>${frmHead(i.name,'In stock '+stockTxt(i),'',0)}${fld('Quantity lost ('+uA(uC(i))+') *',`<input id="l1" class="big" type="number" inputmode="decimal" placeholder="0" oninput="lossUpd(${id})">`,'<span id="l9"></span>')}${fld('What happened',SEG('l2',LOSSR,'Lost'))}${fld('Note',`<input id="l4" placeholder="Optional, e.g. police report no.">`)}<div class="c">This lowers your stock and counts as a loss in profit and loss, at what you paid for the item. If it turns up later, open it from the item's activity and mark it found. Nothing is deleted.</div>`,()=>`<button class="btn" onclick="lossSave(${id})">Save</button>`,0,1)}
function lossSave(id){const i=db.items.find(x=>x.id==id),q=Math.round((+$('#l1').value||0)*1000)/1000;if(!i)return;if(!(q>0))return fieldErr('#l1','Enter the quantity lost.');if(q>(+i.stock||0)+1e-9)return fieldErr('#l1','Only '+stockTxt(i)+' in stock.');
 db.adj.push({id:uid(),item:id,q:-q,t:tOn($('#l3').value||today()),u:Date.now(),why:'loss',rs:segVal('l2')||'Other',note:$('#l4').value.trim()});i.u=Date.now();recalc();save();render();pgBack();pgRefresh();toast('Loss recorded.')}
function lossView(aid){const a=db.adj.find(x=>x.id==aid);if(!a)return;const i=db.items.find(x=>x.id==a.item);if(!i)return;const o=a.why=='loss'?a:db.adj.find(x=>x.id==a.ref),r=lossRows().find(x=>x.a===a),q=qtxt({q:Math.abs(a.q)},i),left=o?lossLeft(o):0,acts=[];
 if(o&&left>0.0004)acts.push(['undo','Found it, put '+(left<Math.abs(o.q)-0.0004?'the rest':'it')+' back in stock',"lossFound('"+o.id+"')"]);
 if(a.why=='found'||!db.adj.some(x=>x.why=='found'&&x.ref==a.id))acts.push(['del','Entered by mistake, remove this entry',"adjUndo('"+aid+"')",'rd']);
 sheet(i.name+' · '+(a.why=='loss'?(a.rs||'Loss')+' −':'Found back +')+q+' · '+dt(a.t)+(r&&Math.abs(r.v)>0.004?' · ₹'+money(Math.abs(r.v)):'')+(o&&a.why=='loss'?(left>0.0004?' · still missing '+qtxt({q:left},i):' · all found back'):''),acts)}
async function lossFound(oid){const o=db.adj.find(x=>x.id==oid);if(!o)return;const i=db.items.find(x=>x.id==o.item),left=lossLeft(o);if(!i||!(left>0))return;const v=await uiPrompt('How many were found? (up to '+fq(left)+' '+uA(uC(i))+')',fq(left),{title:'Found it',type:'number',mode:'decimal',ok:'Put back in stock',check:v=>{const q=Math.round((+v||0)*1000)/1000;return !(q>0)||q>left+1e-9?'Enter a quantity above 0, up to '+fq(left)+' '+uA(uC(i))+'.':''}});if(v===null)return;const n=Math.round((+v||0)*1000)/1000;
 const u=(costing().adj[oid]||0)/Math.abs(o.q);db.adj.push({id:uid(),item:o.item,q:n,t:Date.now(),u:Date.now(),why:'found',ref:oid,rs:o.rs,...(u>0?{c:u}:{})});i.u=Date.now();syncCosts([o.item]);recalc();save();render();pgRefresh();toast('Put back in stock.')}
function delItem(id,ok){const n=itemUses(id);if(n){ask('This item is used in '+n+' record'+(n==1?'':'s')+", so it can't be deleted. Hide it from your lists instead?",'Hide item',"hideItem('"+id+"',1)");return}if(!ok&&(ask('Delete this item? Past bills keep its name.','Delete item',"delItem('"+id+"',1)"),1))return;db.items=db.items.filter(x=>x.id!=id);db.tomb[id]=Date.now();cart=cart.filter(x=>x.id!=id);save();toast('Item deleted.');pgClose()}

/* walk-in customers: every bill and return with no saved customer */
const walkAll=()=>[...db.bills.filter(b=>!b.pid&&!b.void).map(b=>({t:b.t,k:'b',r:b,a:b.total})),...db.notes.filter(n=>n.kind=='c'&&!n.pid&&!n.void).map(n=>({t:n.t,k:'n',r:n,a:-n.total}))].sort((x,y)=>x.t-y.t),lgAll=(k,id)=>k=='s'?sledger(id):id?ledger(id):walkAll();
function walkEntries(){const sp=lgSpan('c',0),out=walkAll().filter(x=>x.t>=sp.from&&x.t<=sp.to).reverse();out.span=sp;return out}
function walkView(){pg('Walk-in customers',()=>{const E=walkEntries(),sl=E.filter(x=>x.k=='b'),rt=E.filter(x=>x.k=='n'),S=sl.reduce((t,x)=>t+x.a,0),R=rt.reduce((t,x)=>t-x.a,0);
 return `<div class="c"><div class="m">${esc(E.span.label)}</div><div class="bal">₹${money(S-R)}<span> net sales incl. GST</span></div><div class="m">${sl.length} bill${sl.length==1?'':'s'} · ₹${money(S)}${rt.length?' · '+rt.length+' return'+(rt.length==1?'':'s')+' −₹'+money(R):''}</div></div>${lgHead('c',0,E.length)}${E.length?lgTable(E.slice(0,200).map(x=>stRow(x,0)).join(''),0):'<div class="empty"><span class="m">No walk-in transactions '+(E.span.from||E.span.to<Infinity?'in this period':'yet')+'.</span></div>'}`},()=>ribbon([['bag','New sale',`flowFrom(()=>walkView());if(editId||isEst||estId)resetSale();bparty='';closeAll();tab='bill';render()`]]))}

 pg(()=>(db.parties.find(x=>x.id==id)||p0).name,()=>{const p=db.parties.find(x=>x.id==id)||p0,owe=p.bal>0.005,st=lgEntries('c',id);
  return `${fresh?'<div class="c ok">✔ Customer saved</div>':''}<div class="c"><div class="m">${esc(p.phone)||'No phone saved'}${p.gstin?' · '+esc(p.gstin):''}</div><div class="bal ${owe?'rcv':''}">₹${money(Math.abs(p.bal))}<span> ${owe?"you'll get":p.bal<-0.005?'advance paid':'all settled'}</span></div>${balNote('c',id)}${odOf(p)>0.5?`<div class="m"><b class="due">₹${money(odOf(p))} overdue</b> · older than ${crD()} days</div>`:''}${owe&&p.rem?`<div class="m">Last reminded ${dt(p.rem)}</div>`:''}${owe?`<div class="row rowt">${qrBtn("payQr('c',"+id+")",p.bal)}${rowBtn("partyShare("+id+")",ic('bell')+' Send reminder')}</div>`:''}</div>${lgHead('c',id,st.length)}${st.length?lgTable(st.map(x=>stRow(x,0)).join('')+lgOpenRow('c',id),1):'<div class="empty"><span class="m">No transactions '+(st.span.from||st.span.to<Infinity?'in this period':'yet')+'.</span></div>'}`},
  ()=>{const p=db.parties.find(x=>x.id==id)||p0;return ribbon([['edit','Edit',`partyForm(${id})`,'','e'],['del','Delete',`delParty(${id})`,'rd','d'],p.bal>0.005?['down','Receive money',`recv(${id})`]:p.bal<-0.005?['up','Refund advance',`refCust(${id})`]:null,db.bills.some(b=>!b.void&&b.pid==id)?['undo','Return items',`retForm('${retK('c').pf}${id}','c')`]:null,['bag','New sale',`bparty=${id};flowFrom(()=>partyView(${id}));closeAll();tab='bill';render()`]])},rep)}
function saveRecv(id,ret){const a=Math.round(+$('#ra').value*100)/100;if(!(a>0))return fieldErr('#ra',ret?'Enter the amount refunded.':'Enter the amount received.');
 const t0=tOn($('#rd').value||today()),sp=segVal('rm')=='Split'?spVals():[{m:segVal('rm')||'Cash',a}];if(!sp.length)return fieldErr('#sp_Cash',MSG.splitNone);
 if(ret){const p=db.parties.find(x=>x.id==id),adv=Math.max(0,-((p&&p.bal)||0)),tot=sp.reduce((t,x)=>t+x.a,0);if(tot>adv+0.005)return fieldErr('#ra',"Refund can't be more than the advance (₹"+money(adv)+").")}
 const nt=(($('#rnt')||{}).value||'').trim();let y;sp.forEach(x=>{y={id:uid(),no:nextRNo(),pid:id,amt:x.a,mode:x.m,t:t0,...(ret?{ret:1}:{}),...(nt?{note:nt}:{})};db.pays.unshift(y)});recalc();save();render();payView(y.id,1,1);toast(ret?'Advance refund recorded.':'Payment recorded.')}

/* ===================== TRANSACTION SUMMARY PAGES =====================
   ONE renderer (sumView) draws every summary, ONE function (txnView) opens every summary and
   ONE builder (txnFoot) makes the bottom buttons. A transaction type is only a small entry in TX.
     Change how ALL summaries look         -> edit sumView (and the row helpers above it)
     Change what ONE transaction shows     -> edit its spec() in TX
     Change one transaction's buttons      -> edit its share / print / edit / more / extra / nw in TX
     Add another transaction summary       -> add a TX entry and a one-line xxxView wrapper below
   Row format used by sumView: [label, value, kind]   kind: 't' grand total · 'b' bold · 'r' green · 'd' red */

/* ---- small formatting helpers ---- */
const rup=v=>'₹'+money(v),
 sdt=(t,tm)=>new Date(t).toLocaleString('en-IN',tm?{dateStyle:'medium',timeStyle:'short'}:{dateStyle:'medium'}),
 pctOf=(v,base)=>base>0.004?' ('+(+(v/base*100).toFixed(1))+'%)':'',
 NA='<span class="m">Not available</span>';

/* ---- row builders shared by several transactions ---- */
/* taxable value, GST and round off on ONE line (as in the original summary) */
const taxLine=o=>['Taxable '+rup(o.tx)+(o.tax>0.004?(o.sp?(o.sp.i>0.004?' · IGST '+rup(o.sp.i):'')+(o.sp.c>0.004?' · CGST '+rup(o.sp.c/2)+' · SGST '+rup(o.sp.c/2):''):o.ig?' · IGST '+rup(o.tax):' · CGST '+rup(o.tax/2)+' · SGST '+rup(o.tax/2)):'')+(Math.abs(o.ro||0)>0.004?' · Round off '+(o.ro>0?'+':'−')+rup(Math.abs(o.ro)):''),''],
 profitRow=(label,pr,tx)=>[label,rup(pr)+pctOf(pr,tx),'b'],
 /* discount / taxable / GST / (extra) / round off / total: used by bill, estimate, purchase and notes */
 totRows=o=>[
  ...(o.disc>0.004?[['Discount'+(o.dp||''),'−'+rup(o.disc),'r']]:[]),
   taxLine(o),...(o.mid||[]),
  ['Total'+(o.sfx||''),rup(o.total),'t']],
 /* item table shared by bill and estimate (line discount shown under the item) */
saleItems=(r,W)=>({h:['Item','Qty','Rate','Amount'],rows:r.lines.map(l=>[
  esc(W?wLineName(l,r,W):l.n)+(l.d>0?`<br><span class="m rcv">discount −${rup(l.d)}${dPct(l.d,lgross(l))}</span>`:''),
  qtxt(l),rateTxt(l),money(lgross(l))])});
/* ---- cash tendered & change: ONE calculator for every summary page ----
   A summary only adds  cash:fresh?cashSpec(record,amount):null  to its spec (money coming IN, right after saving); sumView draws it through cashBox().
   One row: label, the cash received, and the result (Return Change, or Short by). */
let CT={k:'',v:'',d:0};
const cashPart=(r,amt)=>Array.isArray(r.pm)&&r.pm.length?r.pm.reduce((t,x)=>t+(String(x.m).toLowerCase()=='cash'?+x.a||0:0),0):String(r.mode||'Cash').toLowerCase()=='cash'?amt:0,
 cashSpec=(r,amt)=>r.void?null:{due:r2c(cashPart(r,amt))},
 cashInner=()=>{const t=+CT.v||0,ch=Math.round((t-CT.d)*100)/100;return CT.v===''?'':t<CT.d-0.005?`<b class="due">Short by ₹${money(CT.d-t)}</b>`:`<b class="${ch>0.004?'rcv':''}">Return Change: ₹${money(ch)}</b>`},
 cashDraw=()=>{const e=$('#cashx');if(e)e.innerHTML=cashInner()},
 cashIn=el=>{CT.v=el.value;cashDraw()},
 cashBox=(c,key)=>{if(!c||c.due<0.005)return'';if(CT.k!=key)CT={k:key,v:'',d:0};CT.d=c.due;
  return `<div style="margin:6px 2px 0;padding:0 9px"><div class="m" style="display:flex;align-items:center;gap:6px"><span style="white-space:nowrap">Cash tendered :</span><input id="cashi" type="number" inputmode="decimal" min="0" value="${esc(CT.v)}" placeholder="0" oninput="cashIn(this)" style="flex:none;width:80px;min-height:26px;margin:0;padding:1px 7px;font-size:13px"><span id="cashx" style="margin-left:auto;white-space:nowrap;font-size:13px">${cashInner()}</span></div></div>`};

/* ---- the renderer: every summary page is drawn here ----
   o = { void, fresh, info            banner text (cancelled / saved / note)
         type, no, t, tm, sub         header: title, number, date (tm = also show time), extra line
         party:[role,name,extra]      who the transaction is with
         hero:[label,amount,class]    big amount (receipts, vouchers)
         items:{h,rows}               item table
         tots, settle                 row lists: totals block, payment / balance block
         note, act                    small note, buttons html (Receive, Show QR, Pay supplier)
         priv:{title,rows,note}       owner-only panel, never printed or shared }                       */
function sumView(o){
 const rw=r=>{
   const k=r[2],c=k=='r'?'rcv':k=='d'?'due':'';
return k=='t'
    ?`<div class="line sp" style="font-size:15px"><span>${r[0]}</span><b>${r[1]}</b></div>`
    :`<div class="line sp" style="margin-top:3px"><span class="${c||(k=='b'?'':'m')}">${r[0]}</span><span class="${c}">${k=='b'?'<b>'+r[1]+'</b>':r[1]}</span></div>`},
  block=(rows,rule)=>rows&&rows.length?`<div style="margin-top:6px;${rule?'border-top:1px solid var(--line);padding-top:4px':''}">${rows.map(rw).join('')}</div>`:'',
  s=db.shop,
  n=o.items?o.items.rows.length:0,
  banner=o.void?`<div class="c bad">${o.void}</div>`
        :o.fresh?`<div class="c ok">✔ ${o.fresh}</div>`
        :o.info?`<div class="c">${o.info}</div>`:'',
  shop=`<div class="ctr"><b>${esc(s.name)}</b>${s.addr?`<div class="m">${esc(s.addr)}</div>`:''}${shopSt()?`<div class="m">GSTIN ${esc(s.gstin)}</div>`:''}</div>`,
  head=`<div class="line sp" style="margin:8px 0"><div><b>${o.type}${o.no?' '+esc(o.no):''}</b><div class="m">${sdt(o.t,o.tm)}${n?' · '+n+' item'+(n==1?'':'s'):''}</div>${o.sub?`<div class="m">${o.sub}</div>`:''}</div>${o.party?`<div class="rt"><span class="m">${o.party[0]}</span><b>${esc(o.party[1])}</b>${o.party[2]?`<span class="m">${esc(o.party[2])}</span>`:''}</div>`:''}</div>`,
  hero=o.hero?`<div class="m">${o.hero[0]}</div><div class="bal ${o.hero[2]||''}">${rup(o.hero[1])}</div>`:'',
  table=n?`<table class="tbl"><tr>${o.items.h.map(h=>`<th>${h}</th>`).join('')}</tr>${o.items.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`:'',
  wr=o.warranty&&o.warranty.legend.length?`<div style="margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);font-size:12px"><div style="font-weight:700;margin-bottom:2px">Warranty</div>${o.warranty.legend.map(x=>`<div>${esc(x.text)}</div>`).join('')}</div>`:'',
  priv=o.priv&&o.priv.rows&&o.priv.rows.length
   ?ownerBox(`${o.priv.title?`<div class="oh">${o.priv.title}</div>`:''}${ownerRows(o.priv.rows)}${o.priv.note?`<div class="m on">${o.priv.note}</div>`:''}`):'';
 return banner
  +`<div class="c">${shop}${head}${hero}${table}${block(o.tots)}${block(o.ret,1)}${block(o.settle,1)}${block(o.cr,1)}${o.note?`<div class="m" style="margin-top:6px">${o.note}</div>`:''}${wr}${o.act?`<div class="row rowt">${o.act}</div>`:''}</div>`
  +cashBox(o.cash,o.type+o.no+o.t)+priv}

/* ---- owner-only panels ---- */
/* estimate: what it would earn (today's average cost) and how far the price can come down.
   Discount headroom uses the same minimum-margin rule as the bill discount check. */
function estPriv(e){
 const C=costing(),missing=[],mu=1/mgM(),tx=e.total-(e.ro||0)-e.tax;
 let cost=0,sub=0,allowed=1,checked=0;
 e.lines.forEach(l=>{
  const i=db.items.find(x=>x.id==l.id),z=C.S[l.id],
   unit=z&&z.q>0.0001&&z.v>0?z.v/z.q:(C.lc[l.id]>0?C.lc[l.id]:(i&&+i.rc>0?+i.rc:(i&&+i.cost>0?+i.cost:0))),
   amt=lgross(l)-(l.d||0),need=i&&(+i.cost>0||+i.rc>0)&&l.q>0?l.q*pbase(i):0;
  if(unit>0)cost+=unit*l.q;else missing.push(l.n);
  sub+=amt;
  if(need>0){checked++;const f=amt>0?Math.max(0,Math.min(1,1-need*mu/amt)):0;if(f<allowed)allowed=f}});
 const max=checked?Math.floor((sub*allowed+1e-9)*100)/100:null,
  room=max==null?null:Math.max(0,Math.round((max-(e.bd||0))*100)/100);
 return{title:'Bargaining guide',
  rows:[
   missing.length?['Potential profit',NA,'b']:profitRow('Potential profit',tx-cost,tx),
   ['Extra discount you can give',room==null?NA:rup(room)+pctOf(room,e.total),'b'],
   ['Lowest total you can accept',room==null?NA:rup(Math.round(e.total-room))]],
  note:missing.length
   ?'No purchase cost saved for '+missing.slice(0,3).map(esc).join(', ')+(missing.length>3?' and '+(missing.length-3)+' more':'')+', so figures are incomplete.'
   :'Based on current average cost. Discount is held so every item keeps your minimum margin ('+mpP()+'%).'}}
